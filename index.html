
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1">
  <title>Three-lamp retail study</title>

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">
  <script
    src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js">
  </script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
    }
    #panorama {
      width: 100%;
      height: 100%;
    }
    #motionButton {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="panorama"></div>
  <button id="motionButton" type="button">
    Enable motion controls
  </button>

  <script>
    const viewer = pannellum.viewer('panorama', {
      type: 'equirectangular',
      panorama: 'three_lamps_revised_360.jpg',
      autoLoad: true,
      yaw: 0,
      pitch: 0,
      hfov: 95,
      minHfov: 65,
      maxHfov: 110,
      autoRotate: 0,
      orientationOnByDefault: false,
      showZoomCtrl: false
    });

    const button =
      document.getElementById('motionButton');

    button.addEventListener('click', async () => {
      if (viewer.isOrientationActive()) {
        viewer.stopOrientation();
        button.textContent = 'Enable motion controls';
        return;
      }

      if (!viewer.isOrientationSupported()) {
        alert('Motion controls are not supported here. You can still swipe to look around.');
        return;
      }

      try {
        if (
          typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function'
        ) {
          const permission =
            await DeviceOrientationEvent.requestPermission();

          if (permission !== 'granted') {
            alert('Motion permission was not granted.');
            return;
          }
        }

        viewer.startOrientation();
        button.textContent = 'Disable motion controls';
      } catch (error) {
        alert('Unable to activate motion controls. Please use touch navigation.');
      }
    });
  </script>
</body>
</html>
