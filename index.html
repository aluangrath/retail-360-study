<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three-Lamp Product Comparison</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
<style>html,body{margin:0;width:100%;height:100%;background:#171717}#panorama{width:100%;height:100%}</style>
</head>
<body>
<div id="panorama" aria-label="Interactive 360 degree decor store panorama with three lamps"></div>
<script>
pannellum.viewer('panorama', {
 type:'equirectangular',
 panorama:'decor_shop_three_lamps_360.jpg',
 autoLoad:true,
 yaw:0,
 pitch:-12,
 hfov:95,
 autoRotate:0,
 showZoomCtrl:false,
 showFullscreenCtrl:true,
 mouseZoom:false
});
</script>
</body>
</html>
